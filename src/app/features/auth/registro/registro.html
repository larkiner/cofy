<section class="auth">
  <div class="auth-panel">
    <form class="tarjeta-auth" (ngSubmit)="enviar()">
      <h1>Crear cuenta</h1>
      <p class="sub-auth">Crea tu cuenta y gana Granos con cada pedido.</p>

      <label class="campo">
        Nombre
        <input type="text" name="nombre" [(ngModel)]="nombre" required autocomplete="name" />
      </label>

      <label class="campo">
        Correo electrónico
        <input type="email" name="email" [(ngModel)]="email" required autocomplete="email" />
      </label>

      <label class="campo">
        Teléfono
        <input
          type="tel"
          name="telefono"
          [(ngModel)]="telefono"
          required
          inputmode="numeric"
          maxlength="10"
          placeholder="10 dígitos"
          autocomplete="tel"
        />
      </label>

      <label class="campo">
        Contraseña
        <span class="campo-password">
          <input
            [type]="verPassword() ? 'text' : 'password'"
            name="password"
            [(ngModel)]="password"
            required
            minlength="8"
            maxlength="72"
            autocomplete="new-password"
          />
          <app-alternar-password [(visible)]="verPassword" />
        </span>
        <span class="nota">Mínimo 8 caracteres.</span>
      </label>

      @if (error()) {
        <p class="mensaje-error" role="alert">{{ error() }}</p>
      }

      <button type="submit" class="boton grande" [disabled]="cargando()">
        {{ cargando() ? 'Creando cuenta…' : 'Crear cuenta' }}
      </button>

      <p class="enlace-secundario">¿Ya tienes cuenta? <a routerLink="/login">Iniciar sesión</a></p>
    </form>
  </div>

  <div class="auth-media" aria-hidden="true">
    <img src="/img/auth/registro.jpg" alt="" />
    <div class="auth-media-overlay"></div>
    <div class="auth-media-texto">
      <p class="auth-media-frase">
        Gana Granos con cada visita y canjéalos por tus preparaciones favoritas.
      </p>
    </div>
  </div>
</section>
