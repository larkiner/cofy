<section class="auth">
  <div class="auth-media" aria-hidden="true">
    <img src="/img/auth/login.jpg" alt="" />
    <div class="auth-media-overlay"></div>
    <div class="auth-media-texto">
      <span class="eyebrow eyebrow-claro">La aravica</span>
      <p class="auth-media-frase">El ritual de la calma, en cada taza.</p>
    </div>
  </div>

  <div class="auth-panel">
    <form class="tarjeta-auth" (ngSubmit)="enviar()">
      <h1>Bienvenido de vuelta</h1>
      <p class="sub-auth">Entra a tu cuenta de La aravica.</p>

      <label>
        Email
        <input type="email" name="email" [(ngModel)]="email" required autocomplete="email" />
      </label>

      <label>
        Contraseña
        <input type="password" name="password" [(ngModel)]="password" required autocomplete="current-password" />
      </label>

      @if (error()) {
        <p class="mensaje-error">{{ error() }}</p>
      }

      <button type="submit" [disabled]="cargando()">
        {{ cargando() ? 'Entrando…' : 'Entrar' }}
      </button>

      <p class="enlace-secundario">
        ¿No tienes cuenta? <a routerLink="/registro">Regístrate</a>
      </p>
    </form>
  </div>
</section>
