<header class="encabezado">
  <div>
    <h1>Entregar pedido</h1>
    <p class="bajada">Pide al cliente su código de retiro y verifícalo antes de entregar el pedido.</p>
  </div>
</header>

<div class="columna-unica">
  <form class="superficie formulario" (ngSubmit)="entregar()">
    <label class="campo codigo-campo">
      Código de retiro
      <input type="text" name="codigo" [(ngModel)]="codigo" placeholder="RET-XXXXXXXX"
             autocomplete="off" autocapitalize="characters" spellcheck="false" required />
    </label>
    <button type="submit" class="boton grande" [disabled]="procesando()">
      <app-icono nombre="entregar" [tamano]="18" />
      {{ procesando() ? 'Verificando…' : 'Entregar pedido' }}
    </button>
    @if (error()) {
      <p class="mensaje-error" role="alert">{{ error() }}</p>
    }
  </form>

  @if (entregado(); as pedido) {
    <div class="mensaje-ok exito" role="status">
      <app-icono nombre="check-circle" [tamano]="28" />
      <div>
        <p class="exito-titulo">Pedido #{{ pedido.id }} entregado</p>
        <p class="exito-total">Total {{ pedido.total | currency:'COP':'symbol-narrow':'1.0-0' }}</p>
      </div>
    </div>
  }
</div>
