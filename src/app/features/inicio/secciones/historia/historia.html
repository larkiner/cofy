<!-- Alineada a la izquierda; desde 900 px, título a la izquierda y texto a la derecha. -->
<section
  id="historia"
  class="historia mx-auto max-w-(--ancho-marca) px-(--margen-pagina) pt-(--esp-seccion) tablet:grid tablet:grid-cols-[minmax(0,1fr)_minmax(0,var(--ancho-lectura))] tablet:items-start tablet:gap-12"
>
  <h2
    class="mb-4 font-display text-(length:--titulo-seccion) leading-[1.15] font-semibold text-balance text-text tablet:mb-0"
  >
    Del grano a tu taza, con intención
  </h2>
  <p class="max-w-(--ancho-lectura) text-(length:--texto-md) leading-[1.7] text-muted">
    En La aravica tostamos en pequeños lotes granos de origen colombiano, cultivados por manos que
    conocen su tierra. Cada preparación es una pausa deliberada: el ritual de la calma, hecho café.
  </p>
</section>
