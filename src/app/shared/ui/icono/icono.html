<span
  class="block bg-current mask-contain mask-center mask-no-repeat forced-colors:forced-color-adjust-none"
  [style.width.px]="tamano()"
  [style.height.px]="tamano()"
  [style.mask-image]="mascara()"
  [style.-webkit-mask-image]="mascara()"
  [attr.role]="etiqueta() ? 'img' : null"
  [attr.aria-hidden]="etiqueta() ? null : 'true'"
  [attr.aria-label]="etiqueta()"
></span>
