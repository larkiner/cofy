<button
  type="button"
  class="flex w-[44px] cursor-pointer items-center justify-center rounded-sm border-none bg-transparent text-muted transition-[color] duration-[180ms] ease-[ease] hover:text-text focus-visible:text-text focus-visible:shadow-(--ring) focus-visible:outline-none"
  [attr.aria-label]="visible() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
  [attr.aria-pressed]="visible()"
  (click)="alternar()"
>
  <app-icono [nombre]="visible() ? 'eye-off' : 'eye'" [tamano]="20" />
</button>
