@if (pasos(); as lista) {
  <ol class="pasos" aria-label="Seguimiento del pedido">
    @for (paso of lista; track paso.texto) {
      <li
        class="paso"
        [class.hecho]="paso.hecho"
        [class.actual]="paso.actual"
        [attr.aria-current]="paso.actual ? 'step' : null"
      >
        <span class="marca" aria-hidden="true">
          @if (paso.hecho) {
            <app-icono nombre="check" [tamano]="14" />
          }
        </span>
        <span class="texto">{{ paso.texto }}</span>
        @if (paso.hecho) {
          <span class="visualmente-oculto">(completado)</span>
        }
      </li>
    }
  </ol>
}
