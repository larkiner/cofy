@if (items()?.length) {
  @if (enLinea()) {
    <!-- Contenido de frase: se puede usar dentro de un <button>. -->
    <span class="block text-(length:--texto-base) leading-[1.4] font-semibold text-text">
      @for (item of items(); track $index; let ultimo = $last) {
        <span class="min-w-[2.2ch] font-bold text-accent tabular-nums">{{ item.cantidad }}×</span
        >&ngsp;{{ item.producto }}{{ ultimo ? '' : ' · ' }}
      }
    </span>
  } @else {
    <ul
      class="items flex list-none flex-col gap-1 text-(length:--texto-base) leading-[1.3] text-text data-[grande]:gap-[6px] data-[grande]:text-(length:--texto-md) data-[grande]:font-semibold"
      [attr.data-grande]="grande() ? '' : null"
      aria-label="Productos del pedido"
    >
      @for (item of items(); track $index) {
        <li class="flex gap-2">
          <span class="min-w-[2.2ch] font-bold text-accent tabular-nums">{{ item.cantidad }}×</span
          >&ngsp;
          <span>{{ item.producto }}</span>
        </li>
      }
    </ul>
  }
}
